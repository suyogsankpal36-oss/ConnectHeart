services:
  - type: web
    name: connecthearts-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://connecthearts.vercel.app,http://localhost:5173
      - key: FRONTEND_URL
        value: https://connecthearts.vercel.app
      - key: CLIENT_URL
        value: https://connecthearts.vercel.app
